services:
  falkordb-server:
    image: falkordb/falkordb-server:latest
    restart: unless-stopped
    expose:
      - "6379"
    ports:
      - "6389:6379"
    environment:
      REDIS_ARGS: /etc/falkordb/falkordb.conf
    volumes:
      - falkordb-data:/data
      - ./falkordb.conf:/etc/falkordb/falkordb.conf:ro
    networks:
      - falkordb-network

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - falkordb-server
    networks:
      - falkordb-network

networks:
  falkordb-network:
    driver: bridge

volumes:
  falkordb-data:
    driver: local
