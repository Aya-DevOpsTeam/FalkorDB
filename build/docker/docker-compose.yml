services:
  falkordb-server:
    image: falkordb/falkordb-server:latest
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - falkordb-network
    environment:
      - REDIS_ARGS=/etc/falkordb/falkordb.conf
    volumes:
      - falkordb-data:/data
      - ./falkordb.conf:/etc/falkordb/falkordb.conf:ro

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - falkordb-network
    depends_on:
      - falkordb-server

networks:
  falkordb-network:
    driver: bridge

volumes:
  falkordb-data:
    driver: local
